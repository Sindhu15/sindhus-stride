<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Create Reel • SIS Wipro</title>
<style>
  :root { --bg:#0f0f10; --fg:#f6f7f9; --sub:#b7bcc7; --pri:#FF6A3D; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Inter; }
  .wrap { max-width:900px; margin:40px auto; padding:24px; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:var(--sub); margin:0 0 16px; }
  .card { background:#15161a; border:1px solid #23242a; border-radius:16px;
          padding:20px; margin:16px 0; }
  input[type=password] { width:100%; background:#0f1013; color:var(--fg);
          border:1px solid #23242a; border-radius:12px; padding:14px 16px; }
  button { background:var(--pri); color:white; border:none; border-radius:12px;
          padding:12px 18px; font-weight:700; cursor:pointer; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  video { width:100%; max-height:70vh; border-radius:16px; background:black; }
  .hidden{ display:none; }
  .err{ color:#ff6a6a; }
  .muted{ color:var(--sub); font-size:14px; }
  .pill{ background:#1f2025; border:1px solid #2a2b31; padding:6px 10px;
         border-radius:999px; color:var(--sub); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SIS Wipro — Lets do a flasback</h1>
  <p>Enter the group password to generate your shareable reel.</p>

  <div class="card" id="gate-card">
    <label class="muted">Wipro Password</label>
    <input id="pwd" type="password" placeholder="Enter password" />
    <div class="row" style="margin-top:12px">
      <button id="proceed">Proceed & Create Reel</button>
      <span id="status" class="pill">Waiting for input</span>
    </div>
    <div id="err" class="err" style="margin-top:8px"></div>
    <div class="progress-wrap hidden" id="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

   <div>
      The download will take around 2 minutes after you click proceed. 
      Please do some stretching while you wait!<br/>
    </div>

  <div class="card hidden" id="preview-card">
    <div class="row" style="justify-content:space-between;">
      <strong>Preview</strong>
      <span id="meta" class="pill"></span>
    </div>
    <video id="vid" controls playsinline></video>
    <div class="row" style="margin-top:12px">
      <button id="download">Download MP4</button>
    </div>
   
  </div>
</div>

<script>
(function () {
  // helpers
  const $ = (s) => document.querySelector(s);
  const statusEl = $("#status");
  const errEl = $("#err");
  const preview = $("#preview-card");
  const vid = $("#vid");
  const meta = $("#meta");
  const proceedBtn = $("#proceed");
  const pwdInput = $("#pwd");
  const progressWrap = $("#progress-wrap");
  const progressBar = $("#progress-bar");


  function setStatus(t) { statusEl && (statusEl.textContent = t); }
  function showErr(msg) { errEl && (errEl.textContent = msg); }

  async function verifyGate(password) {
    console.log("[gate] POST /gate");
    const res = await fetch("/gate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || `Gate failed (${res.status})`);
    }
    console.log("[gate] ok");
    return true;
  }

  async function createReel() {
  // Optional progress UI
  const wrap = document.querySelector("#progress-wrap");
  const bar  = document.querySelector("#progress-bar");
  if (wrap) wrap.classList.remove("hidden");
  if (bar)  bar.style.width = "0%";

  setStatus("Rendering…");
  console.log("[reel] POST /reel?block=true");

  const res = await fetch("/reel?block=true", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({}), // dates defaulted server-side
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`/reel failed (${res.status}) ${text}`);
  }

  const j = await res.json().catch(() => ({}));

  // If server returned final URL right away
  if (j && j.url) {
    if (bar) bar.style.width = "100%";
    setStatus("Rendering… 100%");
    return j;
  }

  const jobId = j && (j.job_id || j.jobId);
  if (!jobId) throw new Error("No job id returned from /reel");

  // Poll status with % updates
  const maxSeconds = 120;         // up to 2 minutes
  const intervalMs = 1000;        // poll every 1s
  const started = Date.now();

  for (;;) {
    await new Promise(r => setTimeout(r, intervalMs));

    const sRes = await fetch(`/reel/${jobId}/status`);
    if (!sRes.ok) throw new Error(`Status check failed (${sRes.status})`);
    const s = await sRes.json().catch(() => ({}));

    const pct = typeof s.progress === "number" ? Math.max(0, Math.min(100, Math.round(s.progress))) : null;
    const note = s.note ? ` — ${s.note}` : "";

    if (pct != null) {
      if (bar) bar.style.width = pct + "%";
      setStatus(`Rendering… ${pct}%${note}`);
    } else {
      // fallback when progress is unavailable
      setStatus(`Rendering…${note}`);
    }

    if (s.status === "ready" && s.url) {
      if (bar) bar.style.width = "100%";
      setStatus("Rendering… 100%");
      return s;
    }
    if (s.status === "failed") {
      throw new Error("Render failed");
    }

    if ((Date.now() - started) / 1000 > maxSeconds) {
      throw new Error("Timed out waiting for reel");
    }
  }
}


  async function createReelFast() {
  setStatus("Rendering (fast)…");
  const res = await fetch("/api/reels/live", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ /* optional overrides:
      start: "2025-06-19",
      end: "2025-09-18",
      perImageSec: 2.2,
      fps: 30,
      onlyGroupDays: true
    */ }),
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`/api/reels/live failed (${res.status}) ${text}`);
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  // Show player or download
  const a = document.createElement("a");
  a.href = url;
  a.download = `reel-live-${Date.now()}.mp4`;
  a.click();
  setStatus("Done");
  return { url };
}


  function attach() {
    if (!proceedBtn) {
      console.error("Proceed button not found. Are we on reel.html?");
      return;
    }
    // ensure button doesn't act as submit in some browsers
    proceedBtn.setAttribute("type", "button");

    proceedBtn.addEventListener("click", async () => {
      proceedBtn.disabled = true;
      showErr("");
      try {
        console.log("[ui] Proceed clicked");
        const pwd = (pwdInput && pwdInput.value || "").trim();
        if (!pwd) {
          setStatus("Enter password");
          proceedBtn.disabled = false;
          return;
        }
        setStatus("Verifying…");
        await verifyGate(pwd);

        const out = await createReel();
        const dlUrl = out.url || `/reel/${out.job_id}/download`;
        vid.src = dlUrl;
        meta.textContent = "Ready";
        preview.classList.remove("hidden");
        setStatus("Done");

        // Buttons
        $("#download").onclick = () => window.open(dlUrl, "_blank");
        // $("#share").onclick = async () => {
        //   const url = new URL(dlUrl, window.location.origin).toString();
        //   if (navigator.share) {
        //     try { await navigator.share({ title: "SIS Wipro Reel", url }); } catch {}
        //   } else {
        //     try { await navigator.clipboard.writeText(url); alert("Link copied!"); }
        //     catch { prompt("Copy this link:", url); }
        //   }
        // };

        // autoplay (best effort)
        vid.play && vid.play().catch(() => {});
      } catch (e) {
        console.error(e);
        showErr(e.message || "Something went wrong");
        setStatus("Error");
      } finally {
        proceedBtn.disabled = false;
      }
    });

    console.log("[ui] Handler attached");
    setStatus("Waiting for input");
  }

  // attach after DOM is ready
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", attach);
  } else {
    attach();
  }
})();
</script>

</body>
</html>
