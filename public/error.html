

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hang Tight!</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #fffbea;
      color: #444;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }

    .box {
      background: #fff6d9;
      border: 2px dashed #ffc107;
      border-radius: 12px;
      padding: 1.5rem 2rem;
      max-width: 500px;
      box-shadow: 0 0 10px rgba(255, 193, 7, 0.1);
    }

    h1 {
      font-size: 1.8rem;
      color: #ff6f00;
    }

    p {
      margin: 1rem 0;
      font-size: 1rem;
    }

    .email {
      background: #ffecb3;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: bold;
      display: inline-block;
      margin-top: 1rem;
    }

    .emoji {
      font-size: 2rem;
    }

    .gif {
      margin-top: 1rem;
      max-width: 80%;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    .back-button {
      margin-top: 1.5rem;
      display: inline-block;
      padding: 10px 20px;
      background: #25d366;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

  </style>
</head>
<body>
  <div class="box">
    <div class="emoji">🏃‍♀️</div>
    <h1>Whoops, we ran into a tiny hurdle!</h1>
    <img class="gif" src="https://media.giphy.com/media/Y4z9olnoVl5QI/giphy.gif" alt="Running GIF">
    <p id="message" style="color: red;">Something didn't go as planned. But hey, even the best runners trip sometimes!</p>
    <p>Don't worry! Don't give up yet!</p>
    <p>
      <p> Happy to help! Write to me :)</p>
      <a href="mailto:a.sindu15@gmail.com?subject=Sindhu's Stride Support" style="color: #0000EE; text-decoration: underline;">Email me</a>
    </p>
    <a class="back-button" href="/">Back to Home</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const msg = params.get("message");
    if (msg) {
      document.getElementById("message").innerText = decodeURIComponent(msg);
    }
    // TODO: Add logging here if needed
  </script>
</body>
</html>
